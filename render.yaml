services:
  - type: web
    name: c2i-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"

      - key: DATABASE_URL
        value: sqlite:///./challenge_to_impact.db

      - key: JWT_SECRET
        generateValue: true

      - key: FRONTEND_URL
        sync: false

      - key: BACKEND_URL
        sync: false

      - key: DEMO_MODE
        value: "true"

      - key: GEMINI_API_KEY
        sync: false